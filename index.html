<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C6FF4D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m10 15 5-3-5-3v6Z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Curious Mindscape — Shiv Rakshana R | Software Systems</title>
    <meta name="description" content="Personal portfolio of Shiv Rakshana R — Software Systems undergraduate at Coimbatore Institute of Technology. Projects and technical domains in Software Engineering, Systems Analysis, Machine Learning, and Full-Stack Development." />
    <!-- Fonts: Space Grotesk, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        console.error('CRITICAL CLIENT ERROR:', e);
        var div = document.createElement('div');
        div.style = 'color: #ff6666; background: #1a0505; padding: 24px; font-family: monospace; z-index: 999999; position: fixed; top: 20px; left: 20px; right: 20px; border: 2px solid #ff4444; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);';
        div.innerHTML = '<h3 style="margin:0 0 10px 0; font-size:16px;">Runtime JavaScript Error Detected</h3><pre style="white-space:pre-wrap; font-size:12px;">' + (e.message || e.error) + '\nLocation: ' + (e.filename || '') + ':' + (e.lineno || '') + '</pre>';
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('CRITICAL CLIENT REJECTION:', e);
        var div = document.createElement('div');
        div.style = 'color: #ff6666; background: #1a0505; padding: 24px; font-family: monospace; z-index: 999999; position: fixed; top: 20px; left: 20px; right: 20px; border: 2px solid #ff4444; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);';
        div.innerHTML = '<h3 style="margin:0 0 10px 0; font-size:16px;">Unhandled Promise Rejection</h3><pre style="white-space:pre-wrap; font-size:12px;">' + (e.reason && (e.reason.stack || e.reason.message || e.reason)) + '</pre>';
        document.body.appendChild(div);
      });
    </script>
  </head>
  <body class="bg-obsidian text-text-soft font-inter selection:bg-electric-lime selection:text-obsidian antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
